services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-api-sprints-ia}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE_PATH: ${LOG_FILE_PATH:-logs/api.json}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_TOKEN: ${AUTH_TOKEN:?AUTH_TOKEN deve ser configurado no .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      MAX_PAYLOAD_BYTES: ${MAX_PAYLOAD_BYTES:-1048576}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY deve ser configurada no .env}
      OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL:?OPENAI_LLM_MODEL deve ser configurado no .env}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:?OPENAI_EMBEDDING_MODEL deve ser configurado no .env}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      VECTOR_DB_URL: ${VECTOR_DB_URL:-http://chromadb:8000}
      VECTOR_DB_COLLECTION: ${VECTOR_DB_COLLECTION:-sprints}
      EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-true}
      DATA_DIR: ${DATA_DIR:-data}
      MAX_RAG_RANK: ${MAX_RAG_RANK:-10}
      MAX_FRAGMENT_SIZE: ${MAX_FRAGMENT_SIZE:-3000}
      MAX_MESSAGE_LENGTH: ${MAX_MESSAGE_LENGTH:-4000}
      MAX_SPRINTS_PER_REQUEST: ${MAX_SPRINTS_PER_REQUEST:-20}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./data:/app/data:ro
      - ./logs:/app/logs
    depends_on:
      - chromadb
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  chromadb:
    image: chromadb/chroma:1.5.9
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma

volumes:
  chroma-data:
